# Network
bind 0.0.0.0
port 6389
protected-mode no

# Security
aclfile /etc/redis/users.acl
# requirepass your_secure_password_here

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence - AOF
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Persistence - RDB
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice

# Performance
tcp-keepalive 300
