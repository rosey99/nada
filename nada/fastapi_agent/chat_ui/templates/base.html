<!doctype html>
<html lang="en">
    <head>
        {% block head %}
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            href="{{ url_for('static', path='/new_style.css') }}"
            rel="stylesheet"
            type="text/css"
        />

        <title>{% block title %}{% endblock %} - No Title</title>
        {% endblock %}
    </head>
    <body class="minimal">
        <div id="content">{% block content %}{% endblock %}</div>
        <footer id="footer">{% block footer %} {% endblock %}</footer>
    </body>
</html>
