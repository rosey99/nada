<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{APP_TITLE}} Usage Data</title>
        <link
            href="{{ url_for('static', path='/new_style.css') }}"
            rel="stylesheet"
        />
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <style>
            .usage-container {
                max-width: 1200px;
                margin: 0 auto;
                padding: 20px;
            }
            .usage-controls {
                display: flex;
                gap: 15px;
                align-items: flex-end;
                margin-bottom: 20px;
                flex-wrap: wrap;
            }
            .usage-controls .control-group {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .usage-controls label {
                font-size: 12px;
                color: #888;
            }
            .usage-controls input,
            .usage-controls select {
                padding: 8px;
                border: 1px solid #444;
                border-radius: 4px;
                background: #2a2a2a;
                color: #eee;
                font-size: 14px;
            }
            .usage-controls button {
                padding: 8px 20px;
                background: #4a90d9;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
            }
            .usage-controls button:hover {
                background: #357abd;
            }
            .usage-controls button:disabled {
                background: #555;
                cursor: not-allowed;
            }
            #chart-container {
                width: 100%;
                height: 500px;
                border: 1px solid #333;
                border-radius: 8px;
                background: #1a1a1a;
                padding: 10px;
                box-sizing: border-box;
            }
            .usage-legend {
                display: flex;
                gap: 20px;
                margin-top: 10px;
                flex-wrap: wrap;
            }
            .usage-legend-item {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 13px;
            }
            .usage-legend-color {
                width: 16px;
                height: 16px;
                border-radius: 3px;
            }
            .usage-stats {
                display: flex;
                gap: 20px;
                margin-top: 15px;
                flex-wrap: wrap;
            }
            .usage-stat {
                background: #1a1a1a;
                border: 1px solid #333;
                border-radius: 6px;
                padding: 12px 18px;
                min-width: 150px;
            }
            .usage-stat-label {
                font-size: 11px;
                color: #888;
                text-transform: uppercase;
            }
            .usage-stat-value {
                font-size: 20px;
                font-weight: bold;
                color: #eee;
            }
            .usage-error {
                color: #e74c3c;
                padding: 10px;
                background: rgba(231, 76, 60, 0.1);
                border-radius: 4px;
                margin-bottom: 15px;
            }
            .usage-loading {
                color: #888;
                text-align: center;
                padding: 40px;
            }
            .usage-nav {
                display: flex;
                align-items: center;
                gap: 15px;
                margin-bottom: 20px;
            }
            .usage-nav a {
                color: #4a90d9;
                text-decoration: none;
            }
            .usage-nav a:hover {
                text-decoration: underline;
            }
            .quick-dates {
                display: flex;
                gap: 8px;
                align-items: center;
            }
            .quick-dates button {
                padding: 4px 10px;
                font-size: 12px;
                background: #333;
                color: #ccc;
                border: 1px solid #444;
                border-radius: 3px;
                cursor: pointer;
            }
            .quick-dates button:hover {
                background: #444;
                color: #eee;
            }
            .quick-dates button.active {
                background: #4a90d9;
                color: white;
                border-color: #4a90d9;
            }
        </style>
    </head>

    <body class="minimal">
        <div class="usage-container">
            <div class="usage-nav">
                <a href="/agent/v1/chat">← Back to Chat</a>
                <h2 style="margin: 0;">Usage Data</h2>
            </div>

            <div class="usage-controls">
                <div class="control-group">
                    <label for="sinceDate">Since Date</label>
                    <input type="date" id="sinceDate" />
                </div>
                <div class="control-group">
                    <label for="sinceTime">Since Time</label>
                    <input type="time" id="sinceTime" />
                </div>
                <div class="control-group">
                    <label for="untilDate">Until Date</label>
                    <input type="date" id="untilDate" />
                </div>
                <div class="control-group">
                    <label for="untilTime">Until Time</label>
                    <input type="time" id="untilTime" />
                </div>
                <div class="control-group">
                    <label>&nbsp;</label>
                    <div class="quick-dates">
                        <button data-hours="1" type="button">1h</button>
                        <button data-hours="6" type="button">6h</button>
                        <button data-hours="24" type="button">24h</button>
                        <button data-hours="168" type="button">7d</button>
                        <button data-hours="720" type="button">30d</button>
                    </div>
                </div>
                <div class="control-group">
                    <label>&nbsp;</label>
                    <button id="fetchUsage" type="button">Load Usage Data</button>
                </div>
            </div>

            <div id="chart-container"></div>

            <div class="usage-legend" id="usageLegend"></div>

            <div class="usage-stats" id="usageStats"></div>

            <div id="usageError" class="usage-error" style="display: none;"></div>
            <div id="usageLoading" class="usage-loading" style="display: none;">
                Loading usage data...
            </div>
        </div>

        <script src="{{ url_for('static', path='/usage.js') }}"></script>
    </body>
</html>
