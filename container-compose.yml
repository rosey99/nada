version: "3.9"
user: "1000:1000"
userns_mode: "keep-id:uid=1000,gid=1000"
services:
  celery-worker-pool:
    image: nada
    build: .
    depends_on:
      - redis-db
    volumes:
      - ${NADA_HOME_DEFAULT}:/home/default:rw
      - ${NADA_GLOBAL_READ}:/home/richard:ro
    environment:
      HOME: /home/default
      #REDIS_DATA_HOST: ${REDIS_DATA_HOST}
      REDIS_DATA_HOST: redis-db
      REDIS_DATA_PORT: 6389
      REDIS_DATA_DBNUM: ${REDIS_DATA_DBNUM}
      REDIS_DATA_USER: ${REDIS_DATA_USER}
      REDIS_DATA_PASSWORD: ${REDIS_DATA_PASSWORD}
      #REDIS_CACHE_HOST: ${REDIS_CACHE_HOST}
      REDIS_CACHE_HOST: redis-db
      REDIS_CACHE_PORT: 6389
      REDIS_CACHE_DBNUM: ${REDIS_CACHE_DBNUM}
      REDIS_CACHE_USER: ${REDIS_CACHE_USER}
      REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD}
      DB_CONNECTION_URI: ${DB_CONNECTION_URI}
      CELERY_BROKER_URI: redis://${CELERY_REDIS_USER}:${CELERY_REDIS_PASSWORD}@redis-db:6389/2
      CELERY_RESULT_URI: redis://${CELERY_REDIS_USER}:${CELERY_REDIS_PASSWORD}@redis-db:6389/3
      #CELERY_BROKER_URI: ${CELERY_BROKER_URI}
      #CELERY_RESULT_URI: ${CELERY_RESULT_URI}
      APP_DB_CONNECTION_URI: ${APP_DB_CONNECTION_URI}
      PROVIDER_CONFIG_PATH: providers.json
      PROVIDER_DEFAULT: ${PROVIDER_DEFAULT}
      PROVIDER_MODEL_DEFAULT: ${PROVIDER_MODEL_DEFAULT}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GH_TOKEN: ${GH_TOKEN}

  fastapi_agent:
    image: nada
    build: .
    depends_on:
      - redis-db
    volumes:
      - ${NADA_HOME_DEFAULT}:/home/default:rw
      - ${NADA_GLOBAL_READ}:/home/richard:ro
    environment:
      HOME: /home/default
      #REDIS_DATA_HOST: ${REDIS_DATA_HOST}
      REDIS_DATA_HOST: redis-db
      REDIS_DATA_PORT: 6389
      REDIS_DATA_DBNUM: ${REDIS_DATA_DBNUM}
      REDIS_DATA_USER: ${REDIS_DATA_USER}
      REDIS_DATA_PASSWORD: ${REDIS_DATA_PASSWORD}
      #REDIS_CACHE_HOST: ${REDIS_CACHE_HOST}
      REDIS_CACHE_HOST: redis-db
      REDIS_CACHE_PORT: 6389
      REDIS_CACHE_DBNUM: ${REDIS_CACHE_DBNUM}
      REDIS_CACHE_USER: ${REDIS_CACHE_USER}
      REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD}
      DB_CONNECTION_URI: ${DB_CONNECTION_URI}
      CELERY_BROKER_URI: redis://${REDIS_BROKER_USER}:${REDIS_BROKER_PASSWORD}@redis-db:6389/2
      CELERY_RESULT_URI: redis://${REDIS_RESULT_USER}:${REDIS_RESULT_PASSWORD}@redis-db:6389/3
      #CELERY_BROKER_URI: ${CELERY_BROKER_URI}
      #CELERY_RESULT_URI: ${CELERY_RESULT_URI}
      APP_DB_CONNECTION_URI: ${APP_DB_CONNECTION_URI}
      PROVIDER_CONFIG_PATH: providers.json
      PROVIDER_DEFAULT: ${PROVIDER_DEFAULT}
      PROVIDER_MODEL_DEFAULT: ${PROVIDER_MODEL_DEFAULT}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GH_TOKEN: ${GH_TOKEN}

    entrypoint:
      - uvicorn
      - nada.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"

  redis-db:
    image: docker.io/redis:latest
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis-config/redis.conf:/usr/local/etc/redis/redis.conf
      - ./redis-config/users.acl:/etc/redis/users.acl
      - ${REDIS_PERSIST_DIR}:/data:Z
    ports:
      - "6389:6389"
